
<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Sulle on kiri! – Halloweeni üllatus</title>

  <!-- Käekirjafont -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com">
  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- p5.js CDN -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100820;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      touch-action: manipulation;
    }

    /* Nähtamatu, klaviatuuriga kasutatav nupp */
    #avaNupp {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(70vw, 400px);
      height: min(50vw, 280px);
      transform: translate(-50%, -40%);
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      z-index: 5;
    }

    #avaNupp:focus-visible {
      outline: 3px solid #ffd38a;
      outline-offset: 8px;
      border-radius: 14px;
    }

    #avaNupp.peidetud {
      display: none;
    }

    #juhis {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 4;
      color: #ffe3b5;
      font: 24px "Caveat", cursive;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 2px 10px #000;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      #juhis {
        font-size: 19px;
        width: 90%;
      }
    }
  </style>
</head>

<body>

  <button
    id="avaNupp"
    type="button"
    aria-label="Ava üllatusümbrik">
  </button>

  <div id="juhis">
    Vajuta ümbrikule, et avada üllatus!
  </div>

  <script src="sketch.js"></script>

</body>
</html>
